spring:
  datasource:
    url: jdbc:h2:mem:discussionboard
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true

jwt:
  secret: "my-secret-key-my-secret-key-my-secret-key-123456"
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000