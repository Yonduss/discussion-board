spring:
  datasource:
    url: jdbc:h2:mem:discussionboard;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

jwt:
  secret: test-only-jwt-secret-key-that-is-at-least-32-bytes-long
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
