name: discussionboard

services:
  backend:
    image: ghcr.io/yonduss/discussion-board-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL_MODE: REQUIRED
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "false"
      DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
      SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    expose:
      - "8080"

  frontend:
    image: ghcr.io/yonduss/discussionboard-fe-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
