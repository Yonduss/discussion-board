name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/yonduss/discussion-board
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Publish container images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/discussionboard
          chmod 600 ~/.ssh/discussionboard
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create production environment file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          umask 077
          {
            printf 'BACKEND_IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'FRONTEND_IMAGE_TAG=latest\n'
            printf 'HTTP_PORT=80\n'
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=3306\n'
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_DDL_AUTO=update\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
          } > "$RUNNER_TEMP/production.env"

      - name: Copy deployment files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/discussionboard \
            docker-compose.prod.yml \
            ubuntu@"$EC2_HOST":/opt/discussionboard/docker-compose.prod.yml
          scp -i ~/.ssh/discussionboard \
            "$RUNNER_TEMP/production.env" \
            ubuntu@"$EC2_HOST":/opt/discussionboard/.env.next

      - name: Pull backend image and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/discussionboard ubuntu@"$EC2_HOST" '
            set -eu
            cd /opt/discussionboard

            frontend_image_tag=latest
            if [ -f .env ]; then
              saved_frontend_image_tag=$(sed -n \
                "s/^FRONTEND_IMAGE_TAG=//p" .env | tail -n 1)

              if [ -n "$saved_frontend_image_tag" ]; then
                frontend_image_tag=$saved_frontend_image_tag
              fi
            fi

            sed -i \
              "s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=$frontend_image_tag/" \
              .env.next
            chmod 600 .env.next
            mv .env.next .env
            chmod 600 .env
            docker compose --env-file .env -f docker-compose.prod.yml pull backend
            docker compose --env-file .env -f docker-compose.prod.yml up -d --no-deps --remove-orphans --wait backend
            docker compose --env-file .env -f docker-compose.prod.yml exec -T backend \
              curl --fail --silent http://localhost:8080/actuator/health
          '

      - name: Show deployment status on failure
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/discussionboard ubuntu@"$EC2_HOST" '
            if [ -d /opt/discussionboard ]; then
              cd /opt/discussionboard
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml \
                logs --no-color --tail=100 backend
            fi
          ' || true
